# GDDR7_RTX6KBW PIM: 64 channels x 16 banks, 2 banks/PU -> 512 PUs. Timing GDDR7_28Gbps.
Frontend:
  impl: AiMTrace
  clock_ratio: 1

  Translation:
    impl: NoTranslation
    max_addr: 2147483648


MemorySystem:
  impl: AiMDRAM
  clock_ratio: 1

  DRAM:
    impl: HBM2
    org:
      preset: GDDR7_RTX6KBW
    timing:
      preset: GDDR7_28Gbps

  Controller:
    impl: AiM
    clock_ratio: 1
    banks_per_pim_unit: 2
    Scheduler:
      impl: FRFCFS
    RefreshManager:
      impl: AllBank
    plugins:

  AddrMapper:
    impl: RoBaRaCoCh
